# Speicher für den Gradle-Daemon; der Kotlin-Daemon übernimmt diese Werte. Mit 2g lief
# compileDebugKotlin in der CI über zwei Minuten (Runner: 4 Kerne, 16 GB).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Unabhängige Tasks aus core, app und dem Backend-Client gleichzeitig ausführen.
org.gradle.parallel=true
# Build-Cache: unveränderte Tasks kommen aus dem Cache (lokal und, über setup-gradle, in der CI).
org.gradle.caching=true
# Configuration Cache: Die Konfigurationsphase entfällt, solange sich Skripte und Eingaben
# nicht ändern (auch der Backend-Commit aus settings.gradle.kts ist eine solche Eingabe).
org.gradle.configuration-cache=true
android.useAndroidX=true
