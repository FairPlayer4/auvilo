# Dependabot schlägt monatlich neue Versionen der GitHub Actions vor (sie sind in
# .github/workflows/build.yml auf Commit-SHA festgelegt). Ziel ist develop.
# PRs baut keine CI (nur main, Entscheidung 2026-11-13): den Branch lokal bauen
# oder den Workflow "Build" für ihn von Hand starten.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
