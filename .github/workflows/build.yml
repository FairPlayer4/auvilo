# Build und Tests für Pull Requests nach main (gleicher Befehl wie lokal, siehe CLAUDE.md).
name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build und Tests
        run: ./gradlew :core:check :core:koverLog :app:testDebugUnitTest :app:assembleDebug

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: testberichte
          path: |
            core/build/reports/
            app/build/reports/
          retention-days: 7

      - name: Debug-APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
