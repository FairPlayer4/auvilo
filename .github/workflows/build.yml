# Build und Tests auf main (gleicher Befehl wie lokal, siehe CLAUDE.md).
#
# Nur nach dem Merge auf main, nicht bei PRs und nicht auf develop (Entscheidung
# 2026-11-13, GitHub-Minuten sparen, solange das Repo privat ist). Vor einem PR
# nach main lokal mit -PbackendStreng=true bauen. Von Hand für jeden Branch
# startbar (Reiter "Actions"). Wird das Repo öffentlich, wieder bei PRs bauen.
name: Build

on:
  push:
    branches: [main]
    # Reine Doku-Merges brauchen keinen Build.
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Actions sind auf Commit-SHA festgelegt (ein Tag ließe sich nachträglich auf
# fremden Code umhängen); die Version steht als Kommentar dahinter. Dependabot
# schlägt Updates vor (.github/dependabot.yml).

jobs:
  build:
    # Fest auf 24.04: ubuntu-latest wechselt ab Oktober 2026 auf 26.04 (Hinweis im Lauf).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Beide Repos nebeneinander wie auf Kevins Rechner: Die App bindet
    # ../avlreminder-backend/client per Composite Build ein (docs/cloud-entscheidungen.md A-2).
    defaults:
      run:
        working-directory: avlreminder
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: avlreminder
          persist-credentials: false

      - name: Festgehaltener Backend-Commit
        id: backend
        run: echo "commit=$(tr -d '[:space:]' < gradle/backend-commit.txt)" >> "$GITHUB_OUTPUT"

      # Das Backend-Repo ist privat. Der Deploy-Key darf nur dieses Repo lesen
      # (Secret BACKEND_DEPLOY_KEY, Anleitung in docs/cloud-entscheidungen.md).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: FairPlayer4/avlreminder-backend
          ref: ${{ steps.backend.outputs.commit }}
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: avlreminder-backend
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: microsoft
          java-version: 21

      # Gebaut wird nur noch auf main (Standard-Branch); dort schreibt setup-gradle
      # den Cache von selbst.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Offener Cache auf Basis von actions/cache statt des proprietären
          # Standards („enhanced“, eigene Nutzungsbedingungen), wie im Backend.
          cache-provider: basic

      - name: Build und Tests
        # backendStreng: bricht ab, falls der Backend-Stand nicht zum festgehaltenen passt.
        run: ./gradlew -PbackendStreng=true :core:check :core:koverLog :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: testberichte
          path: |
            avlreminder/core/build/reports/
            avlreminder/app/build/reports/
          retention-days: 7

      - name: Debug-APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-debug
          path: avlreminder/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
