# Build und Tests (gleicher Befehl wie lokal, siehe CLAUDE.md).
#
# Auf main, develop und bei PRs (wieder seit dem öffentlichen Repo, 2026-11-23;
# vorher nur main, um GitHub-Minuten zu sparen). PRs aus Forks laufen erst nach
# Freigabe ("Require approval for all external contributors") und ohne Secrets.
# Vor einem PR nach main lokal mit -PbackendStreng=true bauen.
name: Build

on:
  push:
    branches: [main, develop]
    # Reine Doku-Änderungen brauchen keinen Build.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Actions sind auf Commit-SHA festgelegt (ein Tag ließe sich nachträglich auf
# fremden Code umhängen); die Version steht als Kommentar dahinter. Dependabot
# schlägt Updates vor (.github/dependabot.yml).

jobs:
  build:
    # Fest auf 24.04: ubuntu-latest wechselt ab Oktober 2026 auf 26.04 (Hinweis im Lauf).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Beide Repos nebeneinander wie auf Kevins Rechner: Die App bindet
    # ../avlreminder-backend/client per Composite Build ein (docs/cloud-entscheidungen.md A-2).
    defaults:
      run:
        working-directory: avlreminder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: avlreminder
          persist-credentials: false

      - name: Festgehaltener Backend-Commit
        id: backend
        run: echo "commit=$(tr -d '[:space:]' < gradle/backend-commit.txt)" >> "$GITHUB_OUTPUT"

      # Das Backend-Repo ist öffentlich, ein Schlüssel ist nicht nötig. Der Ordner
      # heißt weiter avlreminder-backend wie auf Kevins Rechner (settings.gradle.kts).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FairPlayer4/auvilo-backend
          ref: ${{ steps.backend.outputs.commit }}
          path: avlreminder-backend
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: microsoft
          java-version: 21

      # setup-gradle schreibt den Cache nur auf main (Standard-Branch); develop
      # und PRs lesen ihn nur.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Offener Cache auf Basis von actions/cache statt des proprietären
          # Standards („enhanced“, eigene Nutzungsbedingungen), wie im Backend.
          cache-provider: basic

      - name: Build und Tests
        # backendStreng: bricht ab, falls der Backend-Stand nicht zum festgehaltenen passt.
        run: ./gradlew -PbackendStreng=true :core:check :core:koverLog :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testberichte
          path: |
            avlreminder/core/build/reports/
            avlreminder/app/build/reports/
            avlreminder/wear/build/reports/
          retention-days: 7

      - name: Debug-APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: avlreminder/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Debug-APK der Watch-App
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wear-debug
          path: avlreminder/wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 14
